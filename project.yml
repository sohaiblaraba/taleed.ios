# XcodeGen spec. Regenerate the project after editing it: `xcodegen generate`.
name: Taleed
options:
  bundleIdPrefix: app.taleed.mobile
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# One entry per configuration. Staging is a release build that talks to dev.taleed.app.
configs:
  Debug: debug
  Release: release
  Staging: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
  Staging: Config/Staging.xcconfig

packages:
  TaleedAPI:
    path: TaleedAPI
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.8.0"
  # Sign in with Google (slice G): 7.1 or later for the `nonce:` sign-in.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"

targets:
  Taleed:
    type: application
    platform: iOS
    sources:
      - path: Taleed
    dependencies:
      - package: TaleedAPI
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: GoogleSignIn
        product: GoogleSignIn
      - sdk: AuthenticationServices.framework
    settings:
      base:
        INFOPLIST_FILE: Taleed/Support/Info.plist
        # Associated Domains (applinks, webcredentials) for TALEED_APP_LINK_HOST (Config/Base.xcconfig), and
        # Sign in with Apple (slice G).
        CODE_SIGN_ENTITLEMENTS: Taleed/Support/Taleed.entitlements
        INFOPLIST_PREPROCESS: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        # Taleed's Apple Developer team: the App ID app.taleed.mobile has Sign in with Apple, Push Notifications
        # and Associated Domains. Not a secret.
        DEVELOPMENT_TEAM: Y6MJ5U685L
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TaleedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaleedTests
    dependencies:
      - target: Taleed
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.taleed.mobile.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Taleed.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Taleed
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Taleed:
    build:
      targets:
        Taleed: all
        TaleedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TaleedTests
    archive:
      config: Release

  # Run and archive the Staging configuration (the hosted test backend, the App Store bundle ID), for TestFlight.
  Taleed Staging:
    build:
      targets:
        Taleed: all
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
