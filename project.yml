# XcodeGen spec. Regenerate the project after editing it: `xcodegen generate`.
name: Taleed
options:
  bundleIdPrefix: app.taleed
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# One entry per configuration. A Staging configuration is one more line here,
# plus Config/Staging.xcconfig.
configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  TaleedAPI:
    path: TaleedAPI
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.8.0"

targets:
  Taleed:
    type: application
    platform: iOS
    sources:
      - path: Taleed
    dependencies:
      - package: TaleedAPI
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        INFOPLIST_FILE: Taleed/Support/Info.plist
        INFOPLIST_PREPROCESS: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Taleed provides the app icons later.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  TaleedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaleedTests
    dependencies:
      - target: Taleed
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.taleed.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Taleed.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Taleed
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Taleed:
    build:
      targets:
        Taleed: all
        TaleedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TaleedTests
    archive:
      config: Release
