# XcodeGen spec. Regenerate the project after editing it: `xcodegen generate`.
name: Taleed
options:
  bundleIdPrefix: app.taleed.mobile
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# One entry per configuration. Staging is a release build that talks to dev.taleed.app.
configs:
  Debug: debug
  Release: release
  Staging: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
  Staging: Config/Staging.xcconfig

packages:
  TaleedAPI:
    path: TaleedAPI
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.8.0"
  # Sign in with Google (slice G): 7.1 or later for the `nonce:` sign-in.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"
  # Push (Cloud Messaging), crash reporting (Crashlytics, slice J) and usage statistics (Analytics). 12, not 13: GoogleSignIn 9
  # needs app-check 11, which Firebase 13 left.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  Taleed:
    type: application
    platform: iOS
    sources:
      - path: Taleed
    dependencies:
      - package: TaleedAPI
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCrashlytics
      # Google Analytics without the advertising identifier (no IDFA, no AdSupport).
      - package: Firebase
        product: FirebaseAnalyticsCore
      - sdk: AuthenticationServices.framework
    # GoogleService-Info.plist is not in the repository: it is copied in from TALEED_FIREBASE_CONFIG_DIR when it is
    # there (Config/Base.xcconfig). Without it the app builds and runs with push and crash reporting off.
    postBuildScripts:
      - name: Copy GoogleService-Info.plist
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/copy-firebase-config.sh"
      # Sends the dSYM to Crashlytics, so crash reports show symbols. Only builds that make a dSYM (Release,
      # Staging) and have the Firebase file; Debug has neither.
      - name: Upload dSYM to Crashlytics
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/upload-crashlytics-symbols.sh"
    settings:
      base:
        INFOPLIST_FILE: Taleed/Support/Info.plist
        # Associated Domains (applinks, webcredentials) for TALEED_APP_LINK_HOST (Config/Base.xcconfig), and
        # Sign in with Apple (slice G).
        CODE_SIGN_ENTITLEMENTS: Taleed/Support/Taleed.entitlements
        INFOPLIST_PREPROCESS: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        # Off: the two build scripts read files that may be missing (GoogleService-Info.plist outside the
        # repository, a dSYM only in Release and Staging), which a sandboxed script must declare as inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        # Taleed's Apple Developer team: the App ID app.taleed.mobile has Sign in with Apple, Push Notifications
        # and Associated Domains. Not a secret.
        DEVELOPMENT_TEAM: Y6MJ5U685L
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TaleedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaleedTests
    dependencies:
      - target: Taleed
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.taleed.mobile.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Taleed.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Taleed
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Taleed:
    build:
      targets:
        Taleed: all
        TaleedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TaleedTests
    archive:
      config: Release

  # Run and archive the Staging configuration (the hosted test backend, the App Store bundle ID), for TestFlight.
  Taleed Staging:
    build:
      targets:
        Taleed: all
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
