name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftlint xcodegen

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Xcode project matches project.yml
        run: |
          xcodegen generate
          git diff --exit-code -- Taleed.xcodeproj

  build-and-test:
    name: Build and unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Debug, Release and Staging
        run: |
          for configuration in Debug Release Staging; do
            xcodebuild build \
              -project Taleed.xcodeproj \
              -scheme Taleed \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO
          done

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=lambda r: [int(p) for p in r.split(".iOS-")[1].split("-")])
          for runtime in reversed(runtimes):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"])
                  break
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          xcodebuild test \
            -project Taleed.xcodeproj \
            -scheme Taleed \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
